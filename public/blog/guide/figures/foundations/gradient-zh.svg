<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" role="img" aria-labelledby="title desc">
<title id="title">一次梯度下降更新</title><desc id="desc">从 w=1、b=0 出发，平方误差损失为 3.25。梯度是 (-4, -2.5)。减去学习率 0.1 乘以梯度，得到 w=1.4、b=0.25，损失为 1.40625。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#376556" stroke-width="1.5"/></marker></defs>
<rect x="1" y="1" width="598" height="258" rx="14" fill="#f7f5ef" stroke="#d9ded7"/>
<g font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif" fill="#20382f">
<text x="300" y="33" text-anchor="middle" font-size="21" font-weight="650">一次梯度下降更新</text>
<rect x="28" y="52" width="212" height="100" rx="10" fill="#fff" stroke="#d9ded7"/>
<rect x="360" y="52" width="212" height="100" rx="10" fill="#fff" stroke="#d9ded7"/>
<path d="M254 103h90" stroke="#376556" stroke-width="2" marker-end="url(#arrow)"/>
<text x="134" y="76" text-anchor="middle" font-size="17" font-weight="600">更新前</text>
<text x="134" y="107" text-anchor="middle" font-size="20">w = 1, b = 0</text>
<text x="134" y="134" text-anchor="middle" font-size="17" fill="#52685e">L = 3.25</text>
<text x="466" y="76" text-anchor="middle" font-size="17" font-weight="600">更新后</text>
<text x="466" y="107" text-anchor="middle" font-size="20">w = 1.4, b = 0.25</text>
<text x="466" y="134" text-anchor="middle" font-size="17" fill="#52685e">L = 1.40625</text>
<rect x="28" y="170" width="544" height="66" rx="10" fill="#e9efe9"/>
<text x="300" y="195" text-anchor="middle" font-size="17">梯度 (−4, −2.5) · 学习率 0.1</text>
<text x="300" y="222" text-anchor="middle" font-size="20" font-weight="600">(w, b) ← (w, b) − 0.1 ∇L</text>
</g></svg>
